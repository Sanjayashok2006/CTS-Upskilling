<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Gallery</title>

    <style>
        .imageStyle {
            border: 2px solid black;
        }
    </style>
</head>
<body>

    <table border="1">

        <tr>
            <td>
                <img src="event1.jpg" alt="Music Event" title="Music Event" 
                class="imageStyle" width="150" height="100">
                <p>Music Event</p>
            </td>

            <td>
                <img src="event2.jpg" alt="Sports Event" title="Sports Event" 
                class="imageStyle" width="150" height="100">
                <p>Sports Event</p>
            </td>

            <td>
                <img src="event3.jpg" alt="Food Festival" title="Food Festival" 
                class="imageStyle" width="150" height="100">
                <p>Food Festival</p>
            </td>
        </tr>

        <tr>
            <td>
                <img src="event4.jpg" alt="Dance Show" title="Dance Show" 
                class="imageStyle" width="150" height="100">
                <p>Dance Show</p>
            </td>

            <td>
                <img src="event5.jpg" alt="Art Exhibition" title="Art Exhibition" 
                class="imageStyle" width="150" height="100">
                <p>Art Exhibition</p>
            </td>

            <td>
                <img src="event6.jpg" alt="Community Meeting" title="Community Meeting" 
                class="imageStyle" width="150" height="100">
                <p>Community Meeting</p>
            </td>
        </tr>

    </table>

</body>
</html>
